name: Sync Content to Cloudflare KV

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - '.github/workflows/sync-kv.yml'

jobs:
  sync-kv:
    name: Sync JSON Content to Cloudflare KV
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Content JSON to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          node scripts/sync-kv.js

      - name: Generate Deployment Summary
        if: success()
        run: |
          echo "## ✅ KV Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Synchronized content:**" >> $GITHUB_STEP_SUMMARY
          echo "- Product JSON definitions" >> $GITHUB_STEP_SUMMARY
          echo "- Site settings (site.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Limits & toggles configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Page content (home.json, faqs.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Blog posts" >> $GITHUB_STEP_SUMMARY

      - name: Report Sync Failure
        if: failure()
        run: |
          echo "## ❌ KV Sync Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
