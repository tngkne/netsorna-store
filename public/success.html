<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Order Confirmed — Netsorna Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/shop.css" />
</head>
<body>

  <div class="navbar-wrapper">
    <header class="navbar">
      <div class="navbar-bar">
        <a href="/index.html" class="brand-logo"><span class="logo-text">NETSORNA.</span></a>
      </div>
    </header>
  </div>

  <main class="product-page-main" style="margin-top: 120px; text-align: center; max-width: 540px;">
    <div style="width: 56px; height: 56px; background: #e8f5e9; color: #2e7d32; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 1.5rem;">
      ✓
    </div>

    <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 8px;">Order Received</h1>
    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 24px;">
      Thank you for your commission. Your order record has been logged in our studio queue.
    </p>

    <div style="border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; text-align: left; background: var(--accent-light); margin-bottom: 24px;">
      <h3 style="font-size: 0.9rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px;">Fulfillment Timeline</h3>
      <p style="font-size: 0.85rem; color: var(--text-dark); margin-bottom: 6px;">
        <strong>Estimated Delivery Window:</strong>
      </p>
      <p id="deliveryTimelineDisplay" style="font-size: 1.1rem; font-weight: 600; color: #000;">
        Calculating turnaround...
      </p>
      <span style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-top: 8px;">
        14–20 studio production days + express courier transit.
      </span>
    </div>

    <a href="/index.html" class="btn btn-solid btn-lg" style="width: 100%;">Return to Homepage</a>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Calculate dynamic delivery date offset (+14 to +20 days)
      const now = new Date();
      const minDate = new Date(now);
      minDate.setDate(minDate.getDate() + 14);

      const maxDate = new Date(now);
      maxDate.setDate(maxDate.getDate() + 20);

      const format = (d) => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      
      const display = document.getElementById('deliveryTimelineDisplay');
      if (display) {
        display.textContent = `${format(minDate)} – ${format(maxDate)}`;
      }

      // Clear buy list on successful order completion
      localStorage.removeItem('netsorna_buylist');
    });
  </script>
</body>
</html>
