<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Delivery & Order Details — Netsorna</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/shop.css" />
</head>
<body>

  <div class="navbar-wrapper">
    <header class="navbar" id="navbar">
      <div class="navbar-bar">
        <a href="/index.html" class="brand-logo"><span class="logo-text">NETSORNA.</span></a>
        <a href="/buy-list.html" class="btn btn-subtle btn-sm">← Back to List</a>
      </div>
    </header>
  </div>

  <main class="product-page-main" style="margin-top: 100px; max-width: 600px;">
    <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 6px;">Delivery Details</h1>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px;">
      Enter your delivery information to reserve your studio slot and dispatch schedule.
    </p>

    <form id="customerDetailsForm" style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 4px;">Full Name *</label>
        <input type="text" id="fullName" class="form-input" required placeholder="Jane Doe" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 16px;" />
      </div>

      <div>
        <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 4px;">Email Address *</label>
        <input type="email" id="email" class="form-input" required placeholder="jane@example.com" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 16px;" />
      </div>

      <div>
        <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 4px;">Phone Number (For Courier) *</label>
        <input type="tel" id="phone" class="form-input" required placeholder="+27 82 123 4567" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 16px;" />
      </div>

      <div>
        <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 4px;">Physical Shipping Address *</label>
        <input type="text" id="shippingAddress" class="form-input" required placeholder="Start typing street address..." style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 16px;" />
      </div>

      <div style="background: var(--accent-light); padding: 14px; border-radius: 4px; font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">
        ⏱️ <strong>Artisanal Production Notice:</strong> Handcrafted custom orders carry a 14–20 day studio turnaround prior to courier dispatch.
      </div>

      <button type="submit" class="btn btn-solid btn-lg" id="submitDetailsBtn" style="margin-top: 12px;">
        Proceed to Secure Checkout →
      </button>
    </form>
  </main>

  <script src="/js/main.js"></script>
  <script src="/js/details-form.js"></script>
</body>
</html>
